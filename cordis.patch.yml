# Desktop notifications for DSH Web sessions.
# Host half: listens to agent events, streams them to the page, and raises
# Windows toasts from WSL. Client half: browser notifications and a settings row.
- insert:
    - id: dsh-notifier
      name: dsh-session-notifier
      config:
        events:
          completed: true
          error: true
          approval: true
          question: true
        windowsToast:
          # auto: a page with granted Notification permission shows the browser
          # notification, so no duplicate toast is raised; toast is the fallback.
          # always | never are also accepted.
          enabled: auto
          sound: true
          # Registered under HKCU so Windows shows "DSH Web" as the source.
          appId: DSH.Web
        browser:
          enabled: true
        debounceMs: 4000
        # Also notify for subagent/teammate sessions (default: only top-level sessions).
        includeSubagents: false
